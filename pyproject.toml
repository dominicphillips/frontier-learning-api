[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "frontier-learning-api"
version = "1.0.0"
description = "Read-only FastAPI service and offline-first snapshot collectors for public OpenAI, Claude, and Gemini learning resource metadata."
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.162.0,<1",
  "pydantic>=2.14.1,<3",
  "openai>=3.38.0,<4",
  "uvicorn>=0.54.0,<1",
]

[project.scripts]
frontier-learning-api = "frontier_learning.cli:serve"
frontier-learning-collect = "frontier_learning.cli:collect"

[dependency-groups]
dev = ["pytest>=9.1.1,<10", "httpx>=0.28.1,<1", "ruff>=0.17.2,<1"]

[tool.hatch.build.targets.wheel]
packages = ["src/frontier_learning"]

[tool.hatch.build.targets.wheel.force-include]
"frontend/dist" = "frontier_learning/web"

[tool.hatch.build.targets.sdist.force-include]
"frontend/dist" = "frontend/dist"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --import-mode=importlib"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
